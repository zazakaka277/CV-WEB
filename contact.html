<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<body data-page="contact">

<button id="theme-btn" aria-label="Toggle dark or light theme"><i class="fa-solid fa-circle-half-stroke"></i></button>
<button id="menu-btn" aria-label="Open menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button></header>
<main id="main">
<section class="container"><h1>Contact</h1>
<div class="two">
<div class="glass card"><h3>Details</h3>
<p><i class="fa-solid fa-envelope"></i> you@example.com</p>
<p><i class="fa-solid fa-phone"></i> +855 00 000 000</p>
<p><i class="fa-solid fa-location-dot"></i> Phnom Penh, Cambodia</p>
<div class="socials"><a href="https://github.com/yourname" aria-label="GitHub"><i class="fa-brands fa-github"></i></a><a href="https://linkedin.com/in/yourname" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a></div></div>
<form id="contact-form" class="glass card" novalidate>
 <label for="name">Name</label><input id="name" name="name" autocomplete="name" required>
 <small class="err" data-for="name"></small>
 <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
 <small class="err" data-for="email"></small>
 <label for="subject">Subject</label><input id="subject" name="subject" required>
 <small class="err" data-for="subject"></small>
 <label for="message">Message</label><textarea id="message" name="message" rows="5" required></textarea>
 <small class="err" data-for="message"></small>
 <button class="btn" type="submit">Send message</button>
 <p id="form-status" role="status"></p>
</form></div></section>
</main>
<footer class="container"><p class="muted">© 2026 Your Name. Built with HTML, CSS, JavaScript and Flask.</p></footer>
